openapi: 3.0.3
info:
  title: API Sentinel
  version: 0.2.0
  description: API monitoring service.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: The API process is running.
  /ready:
    get:
      summary: Readiness check
      responses:
        "200": { description: The API can reach PostgreSQL. }
        "500": { description: PostgreSQL is unavailable. }
  /api/auth/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201": { description: User created }
  /api/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200": { description: Token returned }
  /api/monitors:
    get:
      summary: List authenticated user's monitors
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Monitor list }
    post:
      summary: Create a monitor
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Monitor created }
  /api/monitors/{id}:
    delete:
      summary: Delete a monitor
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Monitor deleted }
        "401": { description: Authentication required or token invalid }
        "404": { description: Monitor not found }
  /api/monitors/{id}/checks:
    get:
      summary: List the latest checks for a monitor
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Latest checks, newest first. }
        "401": { description: Authentication required or token invalid }
  /api/incidents:
    get:
      summary: List incidents
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Incident list }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
