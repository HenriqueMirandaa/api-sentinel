openapi: 3.0.3
info:
  title: API Sentinel
  version: 0.2.0
  description: API monitoring service.
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: The API process is running.
  /ready:
    get:
      summary: Readiness check
      responses:
        "200": { description: The API can reach PostgreSQL. }
        "500": { description: PostgreSQL is unavailable. }
  /api/auth/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201": { description: User created }
  /api/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200": { description: Token returned }
  /api/monitors:
    get:
      summary: List authenticated user's monitors
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/MonitorStatus"
      responses:
        "200":
          description: Paginated monitor list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorPage"
    post:
      summary: Create a monitor
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Monitor created }
  /api/monitors/{id}:
    delete:
      summary: Delete a monitor
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Monitor deleted }
        "401": { description: Authentication required or token invalid }
        "404": { description: Monitor not found }
  /api/monitors/{id}/checks:
    get:
      summary: List the latest checks for a monitor
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated checks, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckPage"
        "401": { description: Authentication required or token invalid }
  /api/incidents:
    get:
      summary: List incidents
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IncidentStatus"
      responses:
        "200":
          description: Paginated incidents, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Search:
      name: search
      in: query
      description: Case-insensitive match against monitor name or URL.
      schema: { type: string, maxLength: 100 }
    MonitorStatus:
      name: status
      in: query
      schema: { type: string, enum: [up, down] }
    IncidentStatus:
      name: status
      in: query
      schema: { type: string, enum: [all, open, recovered], default: all }
  schemas:
    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    MonitorPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { type: object } }
        pagination: { $ref: "#/components/schemas/Pagination" }
    CheckPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { type: object } }
        pagination: { $ref: "#/components/schemas/Pagination" }
    IncidentPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { type: object } }
        pagination: { $ref: "#/components/schemas/Pagination" }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
